agent:
  seed: 42
  models:
    separate: true
    policy:
      class: GaussianMixin
      clip_actions: false
      clip_log_std: true
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: 0.0
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 256
        - 256
        activations: elu
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: STATES
        layers:
        - 256
        - 256
        activations: elu
      output: ONE
  memory:
    class: RandomMemory
    memory_size: -1
  agent:
    class: MAPPO
    rollouts: 100
    learning_epochs: 8
    mini_batches: 2
    discount_factor: 0.99
    lambda: 0.95
    learning_rate: 0.001
    learning_rate_scheduler: torch.optim.lr_scheduler.LinearLR
    learning_rate_scheduler_kwargs:
      start_factor: 1.0
      end_factor: 0.01
      total_iters: 1000
    state_preprocessor: RunningStandardScaler
    state_preprocessor_kwargs: null
    shared_state_preprocessor: RunningStandardScaler
    shared_state_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null
    random_timesteps: 0
    learning_starts: 0
    grad_norm_clip: 1.0
    ratio_clip: 0.2
    value_clip: 0.2
    clip_predicted_values: true
    entropy_loss_scale: 0.0
    value_loss_scale: 1.0
    kl_threshold: 0.0
    rewards_shaper_scale: 1.0
    time_limit_bootstrap: false
    mixed_precision: false
    experiment:
      directory: pursuit-evasion
      experiment_name: ''
      write_interval: auto
      checkpoint_interval: auto
      store_separately: false
      wandb: true
  trainer:
    class: SequentialTrainer
    timesteps: '1e6'
    environment_info: log
